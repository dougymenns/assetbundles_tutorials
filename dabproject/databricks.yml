# This is a Declarative Automation Bundle definition for dabproject.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dabproject
  uuid: c125d35f-3fae-447e-aa71-a5698f4a7c04

include:
  - resources/*.yml
  - resources/*/*.yml

variables:
  catalog_name:
    description: The Unity Catalog name for the project
  # catalog:
  #   description: The Unity Catalog name for the project
  # schema:
  #   description: The schema name for the project

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    presets:
      name_prefix: dev_${workspace.current_user.short_name}.
      source_linked_deployment: false
    workspace:
      host: https://dbc-8b3ee136-2761.cloud.databricks.com
    # variables:
    #   catalog_name: assetbundles
    #   catalog: assetbundles
    #   schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-8b3ee136-2761.cloud.databricks.com
    # variables:
    #   catalog_name: assetbundles_prod
    permissions:
      - group_name: admins
        level: CAN_MANAGE
